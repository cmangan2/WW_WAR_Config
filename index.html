<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Build Configurator</title>
<style>
:root{
  --bg:#f4f3f0; --panel:#ffffff; --ink:#1c1d1f; --muted:#6b6d71; --line:#dcdad5;
  --accent:#b3261e; --accent-ink:#ffffff; --ok:#2e7d32; --warn:#9a6700; --err:#b3261e;
  --stage:#e9e7e2; --steel:#3b3d41; --poly:#232427;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121314; --panel:#1b1c1e; --ink:#ecebe8; --muted:#9a9ca1; --line:#2e3033;
    --accent:#e0483e; --accent-ink:#ffffff; --ok:#66bb6a; --warn:#e3b341; --err:#ff6b61;
    --stage:#232427; --steel:#56595e; --poly:#151617;
  }
}
:root[data-theme="dark"]{
  --bg:#121314; --panel:#1b1c1e; --ink:#ecebe8; --muted:#9a9ca1; --line:#2e3033;
  --accent:#e0483e; --accent-ink:#ffffff; --ok:#66bb6a; --warn:#e3b341; --err:#ff6b61;
  --stage:#232427; --steel:#56595e; --poly:#151617;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 8px;max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
header h1{margin:0;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
header .shop{color:var(--muted);font-size:14px}
main{max-width:1240px;margin:0 auto;padding:8px 16px 120px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.left{display:flex;flex-direction:column;gap:16px}
@media (min-width:901px){.left{position:sticky;top:12px;align-self:start}}
.stage{background:var(--stage);border-radius:10px 10px 0 0;padding:8px}
.stage svg{display:block;width:100%;height:auto}
.stage-foot{padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.meter{display:flex;align-items:center;gap:8px}
.meter .bar{width:120px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--ok)}
.summary{padding:14px}
.summary h2,.cat h2,.quote h2{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lines{width:100%;border-collapse:collapse;font-size:14px}
.lines td{padding:4px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.lines td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.lines .sub{font-size:12px;color:var(--muted)}
.lines tr.auto td:first-child{color:var(--muted)}
.lines tr.auto td:first-child::before{content:"+ ";}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin-top:10px}
.notes{margin:10px 0 0;padding:0;list-style:none;font-size:13px}
.notes li{padding:6px 10px;border-radius:6px;margin-top:6px;background:color-mix(in srgb,var(--warn) 12%,transparent);border-left:3px solid var(--warn)}
.notes li.info{background:color-mix(in srgb,var(--muted) 12%,transparent);border-left-color:var(--muted)}
.sample{font-size:12px;color:var(--warn);margin-top:8px}
.right{display:flex;flex-direction:column;gap:12px}
.cat{padding:14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:transparent;color:inherit;text-align:left;font:inherit;width:100%}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt[disabled]{cursor:not-allowed;opacity:.55}
.opt .dot{flex:0 0 14px;height:14px;border-radius:50%;border:2px solid var(--muted);margin-top:3px}
.opt[aria-pressed="true"] .dot{border-color:var(--accent);background:var(--accent)}
.opt.multi .dot{border-radius:3px}
.opt .body{flex:1;min-width:0}
.opt .name{font-weight:600}
.opt .sub{font-size:13px;color:var(--muted)}
.opt .why{font-size:13px;color:var(--err)}
.opt .price{white-space:nowrap;font-weight:600}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;border:1px solid var(--line)}
.quote{padding:14px}
.quote form{display:grid;gap:10px}
.quote label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.quote input,.quote textarea,.quote select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button.primary,button.ghost{font:inherit;font-weight:600;border-radius:6px;padding:10px 16px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border:0}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.msg{font-size:13px;color:var(--ok);min-height:1em}
.bar-total{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:center}
.bar-total>div{max-width:1240px;width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar-total strong{font-size:18px}
</style>
</head>
<body>
<header>
  <h1>Build your AR</h1>
  <div class="shop" id="shopLine"></div>
</header>

<main>
  <section class="left">
    <div class="panel">
      <div class="stage"><svg id="rifle" viewBox="20 30 990 270" role="img" aria-label="Side view of your build"></svg></div>
      <div class="stage-foot">
        <span id="oal"></span>
        <span class="meter">Top rail used <span class="bar"><i id="railBar"></i></span> <span id="railTxt"></span></span>
      </div>
    </div>
    <div class="panel summary">
      <h2>Your build</h2>
      <table class="lines" id="lines"></table>
      <div class="total"><span>Estimated total</span><span id="total"></span></div>
      <ul class="notes" id="notes"></ul>
      <div class="sample" id="sampleNote"></div>
    </div>
  </section>

  <section class="right" id="cats"></section>

  <section class="panel quote" style="grid-column:1/-1">
    <h2>Request a quote</h2>
    <form id="quoteForm">
      <div class="row2">
        <label>Name<input name="name" required autocomplete="name"></label>
        <label>Phone<input name="phone" type="tel" autocomplete="tel"></label>
      </div>
      <div class="row2">
        <label>Email<input name="email" type="email" autocomplete="email"></label>
        <label>Best way to reach you
          <select name="contact"><option>Phone call</option><option>Text</option><option>Email</option></select>
        </label>
      </div>
      <label>Anything else? (timeline, parts you already own, custom Cerakote colors…)<textarea name="notes" rows="3"></textarea></label>
      <div class="btns">
        <button class="primary" type="submit">Send quote request</button>
        <button class="ghost" type="button" id="copyBtn">Copy build summary</button>
        <button class="ghost" type="button" id="linkBtn">Copy link to this build</button>
      </div>
      <div class="msg" id="msg"></div>
    </form>
  </section>
</main>

<div class="bar-total"><div><span id="barName">Basic M4 carbine</span><strong id="barTotal"></strong></div></div>

<script>
/* =====================================================================
   SHOP SETTINGS — edit these
   ===================================================================== */
const SHOP = {
  name: "Wicked Weaponry",
  phone: "603-232-0621",
  quoteEmail: "",          // address that receives quote requests, e.g. "builds@yourshop.com"
  samplePrices: true       // set to false once the prices below are real
};

/* =====================================================================
   CATALOG — every price here is a placeholder. Prices are what the
   option ADDS to the base rifle.
   rail: inches of upper-receiver top rail the part occupies (7" total)
   ===================================================================== */
const BASE = {
  name: "Basic M4-style carbine, 5.56 NATO",
  price: 899,
  includes: "16\" barrel, carbine gas, A2 front sight base, polymer handguard, 6-position stock, mil-spec trigger, flip-up rear sight, one 30-rd magazine. Every build is function-checked and lubed."
};
const UPPER_RAIL = 7.0;

const CATEGORIES = [
  { id:"barrel", label:"Barrel", options:[
    { id:"b16",  name:"16\" government profile", price:0, len:16, sub:"Standard M4 setup" },
    { id:"b145", name:"14.5\" pinned & welded", price:120, len:14.5, pinned:true, sub:"Muzzle device is pinned in-house to make 16\" legal length — it can't be swapped later" },
    { id:"b18",  name:"18\" rifle-length gas", price:90, len:18, sub:"Softer recoil, more velocity" }
  ]},
  { id:"handguard", label:"Handguard", options:[
    { id:"hgc",  name:"Carbine polymer handguard", price:0, ff:false, len:7, sub:"Keeps the A2 front sight base" },
    { id:"hg10", name:"10\" free-float M-LOK", price:189, ff:true, len:10 },
    { id:"hg13", name:"13\" free-float M-LOK", price:209, ff:true, len:13 },
    { id:"hg15", name:"15\" free-float M-LOK", price:229, ff:true, len:15 }
  ]},
  { id:"muzzle", label:"Muzzle device", options:[
    { id:"a2",   name:"A2 birdcage flash hider", price:0 },
    { id:"tri",  name:"3-prong flash hider", price:79 },
    { id:"comp", name:"Compensator", price:99, sub:"Less muzzle rise, more side blast" },
    { id:"qd",   name:"Suppressor-ready QD mount", price:149 }
  ]},
  { id:"optic", label:"Optic", options:[
    { id:"none", name:"No optic — iron sights", price:0 },
    { id:"rd",   name:"1x red dot", price:299, mount:{ name:"Absolute co-witness riser", price:49 }, rail:1.5 },
    { id:"lp6",  name:"1–6x LPVO (30 mm tube)", price:499, tube:30, mount:{ name:"30 mm cantilever mount", price:129 }, rail:5.0 },
    { id:"lp8",  name:"1–8x LPVO (34 mm tube)", price:799, tube:34, mount:{ name:"34 mm cantilever mount", price:159 }, rail:5.0 }
  ]},
  { id:"magnifier", label:"Magnifier", options:[
    { id:"none", name:"None", price:0 },
    { id:"mag3", name:"3x flip-to-side magnifier", price:249, rail:2.5, sub:"Mounts behind a red dot" }
  ]},
  { id:"rear", label:"Rear sight", options:[
    { id:"bu",   name:"Flip-up rear sight", price:0, rail:1.2, sub:"Included" },
    { id:"none", name:"None", price:0 }
  ]},
  { id:"front", label:"Front sight", showIf:b=>opt("handguard",b).ff, options:[
    { id:"bu",   name:"Flip-up front sight", price:59, sub:"Mounts on the handguard rail" },
    { id:"none", name:"None", price:0 }
  ]},
  { id:"stock", label:"Stock", options:[
    { id:"m4",   name:"M4 6-position", price:0 },
    { id:"sop",  name:"SOPMOD-style 6-position", price:89, sub:"Wider cheek weld, storage tubes" },
    { id:"a2s",  name:"Fixed A2 rifle stock", price:69, rifleBuffer:true, sub:"Needs a rifle buffer system (added automatically)" }
  ]},
  { id:"grip", label:"Pistol grip", options:[
    { id:"a2",   name:"A2 grip", price:0 },
    { id:"ergo", name:"Ergonomic rubber-overmold grip", price:25 },
    { id:"vert", name:"Vertical-angle grip", price:35, sub:"Suits a squared-up stance" }
  ]},
  { id:"trigger", label:"Trigger", options:[
    { id:"mil",  name:"Mil-spec single stage", price:0 },
    { id:"enh",  name:"Enhanced single stage", price:149, sub:"Lighter, crisper break" },
    { id:"two",  name:"Two-stage match trigger", price:229 }
  ]},
  { id:"ch", label:"Charging handle", options:[
    { id:"mil",  name:"Mil-spec", price:0 },
    { id:"ambi", name:"Ambidextrous latch", price:79 }
  ]},
  { id:"finish", label:"Finish (done in house)", options:[
    { id:"blk",  name:"Black anodized", price:0, color:"#2b2c2f" },
    { id:"fde",  name:"Cerakote Flat Dark Earth", price:250, color:"#a8916c" },
    { id:"odg",  name:"Cerakote O.D. Green", price:250, color:"#5a5f45" },
    { id:"sgy",  name:"Cerakote Sniper Grey", price:250, color:"#6c7177" },
    { id:"tng",  name:"Cerakote Tungsten", price:250, color:"#5b5c5e" }
  ]},
  { id:"services", label:"Services", multi:true, options:[
    { id:"bore", name:"Boresighting", price:25 },
    { id:"zero", name:"Test fire & zero at 50 yd", price:75 }
  ]}
];

const DEFAULT = { barrel:"b16", handguard:"hgc", muzzle:"a2", optic:"none", magnifier:"none", rear:"bu",
  front:"none", stock:"m4", grip:"a2", trigger:"mil", ch:"mil", finish:"blk", services:[] };

/* ===================================================================== */
const catById = Object.fromEntries(CATEGORIES.map(c=>[c.id,c]));
function opt(cat,b){ return catById[cat].options.find(o=>o.id===b[cat]); }
const $ = id => document.getElementById(id);
const money = n => "$" + n.toLocaleString("en-US");

// Bring dependent parts in line after a change. Returns notices about what moved.
function autofix(b){
  const notes=[];
  if(!opt("handguard",b).ff) b.front="none";
  if(b.magnifier!=="none" && b.optic!=="rd"){ b.magnifier="none"; notes.push("Magnifier removed — it needs a red dot to sit behind."); }
  return notes;
}

function railUsed(b){
  return ["optic","magnifier","rear"].reduce((s,c)=>s+(opt(c,b).rail||0),0);
}

// Builds that can't be assembled. An option that would cause one is greyed out.
function errors(b){
  const e=[], bar=opt("barrel",b), hg=opt("handguard",b);
  if(hg.ff && hg.len > bar.len-1) e.push(`A ${hg.len}" handguard is too long for a ${bar.len}" barrel — use a ${bar.len-1}" or shorter handguard, or a longer barrel.`);
  if(b.magnifier!=="none" && b.optic!=="rd") e.push("A magnifier needs a red dot in front of it.");
  const used=railUsed(b);
  if(used>UPPER_RAIL) e.push(`Not enough top rail: needs ${used.toFixed(1)}" of ${UPPER_RAIL}".`);
  return e;
}

// Things worth telling the customer that don't stop the build.
function warnings(b){
  const w=[], ff=opt("handguard",b).ff;
  const hasFront = !ff || b.front!=="none";
  if(b.optic==="none" && b.rear==="none") w.push({t:"warn", m:"No sights or optic selected."});
  else if(b.optic==="none" && !hasFront) w.push({t:"warn", m:"Iron sights need a front sight — add the flip-up front sight."});
  if(b.optic!=="none" && b.optic!=="rd" && b.rear!=="none") w.push({t:"info", m:"The rear sight folds down under the LPVO and won't co-witness."});
  if(opt("barrel",b).pinned) w.push({t:"info", m:`Your ${opt("muzzle",b).name.toLowerCase()} will be pinned & welded — pick carefully.`});
  return w;
}

// Parts added because of other choices.
function autoLines(b){
  const l=[], o=opt("optic",b);
  if(opt("handguard",b).ff) l.push({name:"Low-profile gas block (replaces front sight base)", price:59});
  if(o.mount) l.push({name:o.mount.name, price:o.mount.price});
  if(opt("stock",b).rifleBuffer) l.push({name:"Rifle buffer tube, spring & buffer", price:65});
  if(opt("barrel",b).pinned) l.push({name:"Pin & weld muzzle device", price:0});
  return l;
}

function priceOf(b){
  let t=BASE.price;
  for(const c of CATEGORIES){
    if(c.multi) t+=c.options.filter(o=>b[c.id].includes(o.id)).reduce((s,o)=>s+o.price,0);
    else if(!c.showIf || c.showIf(b)) t+=opt(c.id,b).price;
  }
  return t+autoLines(b).reduce((s,l)=>s+l.price,0);
}

/* ----- state ----- */
let build = loadFromHash() || structuredClone(DEFAULT);
let lastNotices = [];

function loadFromHash(){
  try{
    if(!location.hash.slice(1)) return null;
    const b = Object.assign(structuredClone(DEFAULT), JSON.parse(decodeURIComponent(atob(location.hash.slice(1)))));
    for(const c of CATEGORIES){
      if(c.multi){ if(!Array.isArray(b[c.id])) b[c.id]=DEFAULT[c.id]; continue; }
      if(!c.options.some(o=>o.id===b[c.id])) b[c.id]=DEFAULT[c.id];
    }
    autofix(b);
    return errors(b).length ? null : b;
  }catch{ return null; }
}
function hashOf(b){ return btoa(encodeURIComponent(JSON.stringify(b))); }

function choose(catId, optId){
  const c=catById[catId];
  if(c.multi){
    const set=new Set(build[catId]); set.has(optId)?set.delete(optId):set.add(optId);
    build[catId]=[...set];
  } else build[catId]=optId;
  lastNotices = autofix(build);
  history.replaceState(null,"","#"+hashOf(build));
  render();
}

/* ----- options panel ----- */
function renderCats(){
  const html=[];
  for(const c of CATEGORIES){
    if(c.showIf && !c.showIf(build)) continue;
    html.push(`<div class="panel cat"><h2>${c.label}</h2><div class="opts">`);
    for(const o of c.options){
      const on = c.multi ? build[c.id].includes(o.id) : build[c.id]===o.id;
      let why="";
      if(!on && !c.multi){
        const trial={...build,[c.id]:o.id}; autofix(trial);
        const e=errors(trial); if(e.length) why=e[0];
      }
      const extra = o.mount ? `Needs ${o.mount.name.toLowerCase()} (+${money(o.mount.price)})` :
                    o.rifleBuffer ? "+ rifle buffer kit ($65)" : "";
      const sw = o.color ? `<span class="swatch" style="background:${o.color}"></span>` : "";
      html.push(`<button type="button" class="opt${c.multi?" multi":""}" aria-pressed="${on}" ${why?"disabled":""}
        data-cat="${c.id}" data-opt="${o.id}"><span class="dot"></span><span class="body">
        <div class="name">${sw}${o.name}</div>
        ${o.sub?`<div class="sub">${o.sub}</div>`:""}
        ${extra?`<div class="sub">${extra}</div>`:""}
        ${why?`<div class="why">${why}</div>`:""}
        </span><span class="price">${o.price? "+"+money(o.price) : "—"}</span></button>`);
    }
    html.push(`</div></div>`);
  }
  $("cats").innerHTML=html.join("");
}
$("cats").addEventListener("click",e=>{
  const btn=e.target.closest(".opt"); if(!btn||btn.disabled) return;
  choose(btn.dataset.cat, btn.dataset.opt);
});

/* ----- summary ----- */
function summaryLines(b){
  const rows=[{name:BASE.name, price:BASE.price}];
  for(const c of CATEGORIES){
    if(c.showIf && !c.showIf(b)) continue;
    if(c.multi){ c.options.filter(o=>b[c.id].includes(o.id)).forEach(o=>rows.push({name:`${c.label}: ${o.name}`, price:o.price})); continue; }
    if(b[c.id]===DEFAULT[c.id]) continue;
    const o=opt(c.id,b); rows.push({name:`${c.label}: ${o.name}`, price:o.price});
  }
  return rows;
}
function renderSummary(){
  const rows=summaryLines(build).map((r,i)=>`<tr><td>${r.name}${i?"":`<div class="sub">${BASE.includes}</div>`}</td><td>${r.price?money(r.price):"incl."}</td></tr>`);
  autoLines(build).forEach(l=>rows.push(`<tr class="auto"><td>${l.name}</td><td>${l.price?money(l.price):"incl."}</td></tr>`));
  $("lines").innerHTML=rows.join("");
  const t=money(priceOf(build));
  $("total").textContent=t; $("barTotal").textContent=t;
  const notes=[...lastNotices.map(m=>({t:"info",m})), ...warnings(build)];
  $("notes").innerHTML=notes.map(n=>`<li class="${n.t}">${n.m}</li>`).join("");
  const used=railUsed(build);
  $("railBar").style.width=Math.min(100,used/UPPER_RAIL*100)+"%";
  $("railTxt").textContent=`${used.toFixed(1)}" / ${UPPER_RAIL}"`;
  const oal = opt("barrel",build).len + 3.2 + (opt("stock",build).rifleBuffer?14.6:11.5);
  $("oal").textContent=`Approx. overall length ${oal.toFixed(1)}"`;
}

/* ----- side-view drawing (scale: 25 px per inch, receiver face at x=478) ----- */
function drawRifle(b){
  const S=25, F=478, C=opt("finish",b).color, P="var(--poly)", ST="var(--steel)";
  const bar=opt("barrel",b), hg=opt("handguard",b), barEnd=F+bar.len*S;
  const g=[];
  const R=(x,y,w,h,f,extra="")=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${extra}/>`;

  // stock
  const st=b.stock;
  if(st==="a2s"){
    g.push(`<path d="M44,104 L292,112 L292,140 L64,200 L44,200 Z" fill="${P}"/>`, R(34,100,12,104,P,'rx="3"'));
  } else {
    g.push(R(168,113,126,15,ST));
    if(st==="sop"){
      g.push(`<path d="M150,98 L268,107 L268,136 L234,146 L150,198 Z" fill="${P}"/>`, R(176,96,74,16,P,'rx="4"'), R(142,96,12,106,P,'rx="3"'));
    } else {
      g.push(`<path d="M160,102 L265,110 L265,132 L232,140 L160,194 Z" fill="${P}"/>`, R(152,100,10,96,P,'rx="3"'));
    }
  }
  // barrel
  g.push(R(F,124,barEnd-F,12,ST));
  // muzzle device
  const m=b.muzzle, mx=barEnd;
  if(m==="a2") g.push(R(mx,121,54,18,ST,'rx="2"'), ...[12,24,36].map(d=>R(mx+d,121,5,7,"var(--stage)")));
  if(m==="tri") g.push(R(mx,122,18,16,ST), R(mx+18,121,40,4,ST), R(mx+18,128,40,4,ST), R(mx+18,135,40,4,ST));
  if(m==="comp") g.push(R(mx,119,56,22,ST,'rx="3"'), ...[14,26,38].map(d=>R(mx+d,119,6,9,"var(--stage)")));
  if(m==="qd") g.push(R(mx,120,50,20,ST,'rx="3"'), R(mx+4,118,10,24,ST,'rx="2"'));
  if(bar.pinned) g.push(`<circle cx="${mx+4}" cy="130" r="2.5" fill="var(--warn)"/>`);
  // handguard
  if(hg.ff){
    const x2=F+hg.len*S;
    g.push(R(F,102,x2-F,50,C,'rx="6"'), R(F,97,x2-F,6,C), ...Array.from({length:Math.floor((x2-F-30)/44)},(_,i)=>R(F+24+i*44,132,26,8,"rgba(0,0,0,.35)",'rx="4"')));
    for(let x=F+4;x<x2-6;x+=10) g.push(R(x,96,5,3,"rgba(0,0,0,.35)"));
    if(b.front==="bu") g.push(`<path d="M${x2-34},96 L${x2-10},96 L${x2-16},74 L${x2-28},74 Z" fill="${P}"/>`, R(x2-24,66,4,10,P));
  } else {
    const x2=F+hg.len*S;
    g.push(R(F,106,10,48,ST), R(F+10,110,x2-F-10,40,P,'rx="10"'));
    for(let x=F+24;x<x2-12;x+=18) g.push(R(x,114,4,32,"rgba(255,255,255,.06)"));
    const fx=x2+6;
    g.push(R(fx,120,22,22,C), `<path d="M${fx+2},121 L${fx+20},121 L${fx+14},86 L${fx+8},86 Z" fill="${C}"/>`, R(fx+9,78,4,10,C));
  }
  // upper receiver + rail
  g.push(R(290,104,F-290,24,C), R(294,98,F-298,7,C), R(384,110,48,10,"rgba(0,0,0,.4)",'rx="2"'), `<circle cx="462" cy="118" r="6" fill="rgba(0,0,0,.25)"/>`);
  for(let x=297;x<F-8;x+=10) g.push(R(x,97,5,3,"rgba(0,0,0,.35)"));
  g.push(R(280,106,12,8,ST));
  if(b.ch==="ambi") g.push(R(274,102,8,16,ST,'rx="2"'));
  // lower receiver, magazine, grip, trigger
  g.push(`<path d="M290,128 L478,128 L478,150 L415,150 L412,180 L358,180 L352,150 L300,150 Z" fill="${C}"/>`);
  g.push(`<path d="M362,180 L410,180 Q418,236 442,266 L394,280 Q372,236 362,180 Z" fill="${P}"/>`);
  g.push(`<path d="M332,150 L332,170 Q334,176 356,174 L356,150" fill="none" stroke="${C}" stroke-width="4"/>`);
  g.push(`<path d="M340,150 Q342,160 338,166" fill="none" stroke="${b.trigger==="mil"?ST:"var(--accent)"}" stroke-width="3"/>`);
  const grips={a2:"M302,150 L332,150 L308,226 L284,222 Z", ergo:"M300,150 L334,150 L314,229 Q300,234 284,226 Z", vert:"M304,150 L334,150 L324,228 L298,228 Z"};
  g.push(`<path d="${grips[b.grip]}" fill="${P}"/>`);
  // rear sight (folded when an optic is mounted)
  if(b.rear==="bu"){
    if(b.optic==="none") g.push(`<path d="M298,97 L324,97 L318,74 L304,74 Z" fill="${P}"/>`);
    else g.push(R(298,90,26,7,P,'rx="2"'));
  }
  // optics
  const o=b.optic;
  if(o==="rd"){
    g.push(R(418,82,44,15,P), R(414,54,52,30,P,'rx="8"'), `<circle cx="440" cy="68" r="7" fill="var(--accent)" opacity=".7"/>`);
    if(b.magnifier==="mag3") g.push(R(352,84,40,13,P), R(338,58,66,28,P,'rx="10"'));
  }
  if(o==="lp6"||o==="lp8"){
    const t=o==="lp8"?12:10;
    g.push(R(350,80,24,17,P), R(424,80,24,17,P), R(336,72-t,140,2*t,P,'rx="4"'), R(470,56,40,32,P,'rx="6"'), R(306,58,36,28,P,'rx="6"'), R(392,58-t+12,18,10,P,'rx="2"'));
  }
  return g.join("");
}

function render(){
  $("rifle").innerHTML=drawRifle(build);
  renderCats(); renderSummary();
}

/* ----- quote ----- */
function quoteText(f){
  const lines=summaryLines(build).map(r=>`- ${r.name}${r.price?` (${money(r.price)})`:""}`);
  autoLines(build).forEach(l=>lines.push(`- + ${l.name}${l.price?` (${money(l.price)})`:""}`));
  return [
    `AR build quote request — ${SHOP.name}`,
    f?`From: ${f.get("name")}  |  Phone: ${f.get("phone")||"—"}  |  Email: ${f.get("email")||"—"}  |  Prefers: ${f.get("contact")}`:"",
    "", ...lines, "",
    `Estimated total: ${money(priceOf(build))}${SHOP.samplePrices?" (sample pricing)":""}`,
    f&&f.get("notes")?`\nNotes: ${f.get("notes")}`:"",
    `\nBuild link: ${location.href.split("#")[0]}#${hashOf(build)}`
  ].filter(x=>x!=="").join("\n");
}
async function copy(t,ok){
  try{ await navigator.clipboard.writeText(t); $("msg").textContent=ok; }
  catch{ $("msg").textContent="Couldn't copy automatically — select and copy from the email draft instead."; }
}
$("quoteForm").addEventListener("submit",e=>{
  e.preventDefault();
  const f=new FormData(e.target);
  if(!f.get("phone") && !f.get("email")){ $("msg").textContent="Add a phone number or email so the shop can reach you."; return; }
  const body=quoteText(f);
  location.href=`mailto:${SHOP.quoteEmail}?subject=${encodeURIComponent("AR build quote request — "+f.get("name"))}&body=${encodeURIComponent(body)}`;
  $("msg").textContent = SHOP.quoteEmail ? "Your email app should open with the build filled in — just hit send." :
    `Your email app should open with the build filled in. Or call us at ${SHOP.phone}.`;
});
$("copyBtn").onclick=()=>copy(quoteText(null),"Build summary copied.");
$("linkBtn").onclick=()=>copy(`${location.href.split("#")[0]}#${hashOf(build)}`,"Link copied — anyone with it sees this exact build.");

$("shopLine").textContent=`${SHOP.name} · custom AR builds · ${SHOP.phone}`;
$("sampleNote").textContent=SHOP.samplePrices?"Sample pricing for demonstration — final price confirmed with your quote.":"Final price confirmed with your quote.";
$("barName").textContent=BASE.name;
render();
</script>
